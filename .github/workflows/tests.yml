name: Platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install platform dependencies
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: Run tests
        run: uv run --frozen python -B -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        run: node --check ui/app.js
